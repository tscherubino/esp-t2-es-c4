<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-900">
    <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-stone-900 focus:px-4 focus:py-3 focus:text-white">Pular para o conteúdo</a>
    <header class="border-b border-stone-200 bg-white">
      <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4 sm:px-6" aria-label="Navegação principal">
        <a href="/" class="text-lg font-bold tracking-tight text-stone-900">{{ app_name }}</a>
        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm font-medium">
          <a class="rounded-md px-2 py-1 text-stone-600 hover:text-amber-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700" href="/recipes">Receitas</a>
          <a class="rounded-md px-2 py-1 text-stone-600 hover:text-amber-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700" href="/recipes/import">Importar</a>
          <a class="rounded-md px-2 py-1 text-stone-600 hover:text-amber-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700" href="/shopping-list">Lista de compras</a>
          <a class="rounded-lg bg-amber-700 px-3 py-2 text-white hover:bg-amber-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700" href="/recipes/new">Nova receita</a>
        </div>
      </nav>
    </header>
    <main id="conteudo" class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
      {% block content %}{% endblock %}
    </main>
    <footer class="mx-auto max-w-6xl space-y-1 px-4 pb-8 text-sm text-stone-500 sm:px-6"><p>Livro Vivo de Receitas · seu acervo pessoal, no seu computador.</p><p>As receitas e imagens ficam somente neste ambiente local. Não use dados de terceiros sem autorização.</p></footer>
  </body>
</html>
